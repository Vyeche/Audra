# Dependabot: library updates, monthly, grouped so they come as few pull
# requests. Each one still goes through the gauntlet and the owner's review.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      rust-libraries:
        patterns: ["*"]
    # These follow the copies Audra shares with its toolkit and its file
    # dialogs: tiny-skia and png with iced's renderer, ashpd with rfd, rand
    # with ashpd. A newer one would add a second copy (and for ashpd a second
    # D-Bus stack), so they move when iced or rfd move. Fixes within a
    # version still come.
    ignore:
      - dependency-name: tiny-skia
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: png
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: ashpd
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: rand
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
